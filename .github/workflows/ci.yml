name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (usado em src/db.js) exige Node >= 22.5; a mesma
          # versao (24) roda em producao via systemd, ver CLAUDE.md.
          node-version: "24"
      - run: npm install
      - run: npm test
